# made by CasualArclamp
[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
# A patched copy of a published crate (see its Cargo.toml), not ours to lint.
exclude = ["vendor"]

[workspace.package]
version = "0.4.2"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/CasualArclamp/DecAero"
rust-version = "1.89"

[workspace.dependencies]
num-complex = "0.4.6"
rustfft = "6.4"
thiserror = "2"

# DSP is unusably slow unoptimised (same tradeoff as DecSAT).
[profile.dev]
opt-level = 1
incremental = false
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = "line-tables-only"
lto = "thin"

# Two USB radio drivers changed to work on Android (each Cargo.toml says how).
[patch.crates-io]
libairspy-rs = { path = "vendor/libairspy-rs" }
rtl-sdr-rs = { path = "vendor/rtl-sdr-rs" }

[workspace.lints.clippy]
# `chunks_exact(2)` reads better than `as_chunks::<2>().0` to someone new to Rust.
chunks_exact_to_as_chunks = "allow"
