# rtl-sdr-rs 0.4.3 (https://github.com/ccostes/rtl-sdr-rs, MPL-2.0), kept here
# with one change so that it builds for Android: there a program cannot list
# USB devices itself (nusb leaves `list_devices` out), so the two places that
# list them go through `usb_devices` in src/lib.rs, which finds none on
# Android. A dongle is opened there with `RtlSdr::open_with_fd`, which the
# crate already has. Two small additions besides: the dongle's USB names can
# be handed in (`hint_usb_strings`), for where the driver cannot read them
# itself, and the tuner's PLL lock can be asked for (`pll_locked`). The
# A Blog V4 is also known by its product name alone when the manufacturer's
# cannot be read (`detect_blog_model` in src/rtlsdr.rs). The
# changed files (src/lib.rs, src/rtlsdr.rs, src/device/device_handle.rs,
# src/tuners/r82xx.rs) say so where they differ; the rest is as published. The workspace's
# `[patch.crates-io]` puts this copy in place of the published crate.
[package]
name = "rtl-sdr-rs"
version = "0.4.3"
edition = "2021"
license = "MPL-2.0"
description = "RTL-SDR USB software defined radio library"
repository = "https://github.com/ccostes/rtl-sdr-rs"
readme = "readme.md"
publish = false

[features]
default = []
rtl_sdr_blog = []
disable-simd = []

[dependencies]
nusb = "0.2"
byteorder = "1"
log = "0.4"

# Upstream lists mockall with the ordinary dependencies; only its tests use it.
[dev-dependencies]
mockall = "0.11"
num-complex = "0.4"
