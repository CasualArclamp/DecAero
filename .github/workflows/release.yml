# made by CasualArclamp
# Portable Windows release of a tag. Pushing a tag v* (or Actions → Release → Run
# workflow with an existing tag) builds decaero-gui.exe with the static C runtime,
# checks that its version matches the tag and that it needs no C runtime DLL, and
# uploads it with its SHA-256 to a draft release of the tag. Then write the release
# notes and publish it:
#
#   gh release edit vX.Y.Z --notes-file notes.md --draft=false --latest
#
# A release that is already published is never touched: the job fails instead. A trial
# run without a release: `gh workflow run release.yml -f tag=main -f upload=false`.
# (Pattern from DecSAT's release workflow.)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (vX.Y.Z), or a branch for a trial run without upload
        required: true
      upload:
        description: Upload the executable to a draft release of the tag
        type: boolean
        default: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  windows:
    name: Windows portable
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build (static C runtime)
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --target x86_64-pc-windows-msvc -p decaero-gui
      - name: Check (version, no C runtime DLL)
        shell: bash
        run: |
          set -euo pipefail
          bin=target/x86_64-pc-windows-msvc/release
          "$bin/decaero-gui" --version
          if [[ $TAG == v* ]]; then
            test "$("$bin/decaero-gui" --version)" = "decaero-gui ${TAG#v}"
          fi
          if grep -a -q -i -e vcruntime140 -e api-ms-win-crt "$bin/decaero-gui.exe"; then
            echo "decaero-gui.exe imports a C runtime DLL: not a static build" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: decaero-gui
          path: target/x86_64-pc-windows-msvc/release/decaero-gui.exe
      - name: Draft release
        if: github.event_name == 'push' || inputs.upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp target/x86_64-pc-windows-msvc/release/decaero-gui.exe .
          {
            echo "Portable Windows executable for 64-bit Windows 10/11, nothing to install (static C runtime)."
            echo
            echo "| File | What |"
            echo "|---|---|"
            echo "| \`decaero-gui.exe\` | Inmarsat Classic Aero receiver: P channels (600, 1200, 10500 bit/s) with ACARS, C channel voice (8400 and 21000 bit/s) with call recording, voice follow. Input from a recording, an SDR++ server, plain TCP/UDP I/Q, or a HackRF, Airspy / HydraSDR, ADALM-PLUTO, SDRplay, Fobos, RTL-SDR or USRP |"
            echo
            echo "Receive only. Windows SmartScreen may warn on first start because the file is unsigned (\"More info\", then \"Run anyway\")."
            echo
            echo "Built from $(git rev-parse --short HEAD) by [GitHub Actions]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo
            echo "SHA-256:"
            echo '```'
            # (Git Bash's sha256sum marks binary mode with a star: "hash *file".)
            sha256sum decaero-gui.exe | sed 's/ \*/  /'
            echo '```'
          } > notes.md
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null); then
            if [ "$draft" != true ]; then
              echo "release $TAG is already published: not replacing its files" >&2
              exit 1
            fi
            gh release upload "$TAG" decaero-gui.exe --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --draft --verify-tag --title "DecAero ${TAG#v} (Windows portable)" \
              --notes-file notes.md decaero-gui.exe
          fi
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
